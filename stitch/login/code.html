<body class="bg-surface font-body text-on-surface antialiased selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Main Container: Note: Navigation is suppressed for focused transactional journey -->
<main class="min-h-screen flex items-center justify-center p-6 sm:p-12 relative overflow-hidden">
<!-- Subtle Academic Ether Background Elements -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none opacity-40">
<div class="absolute top-[-10%] left-[-5%] w-[40%] h-[40%] rounded-full bg-secondary-container blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-5%] w-[40%] h-[40%] rounded-full bg-primary-container blur-[120px]"></div>
</div>
<div class="w-full max-w-[440px] z-10">
<!-- Brand Anchor -->
<div class="flex flex-col items-center mb-10 text-center">

<span class="material-symbols-outlined text-4xl" data-icon="router">router</span>
</div>
<h2 class="font-headline text-3xl font-extrabold tracking-tight text-on-surface mb-2">Welcome Back</h2>
<p class="text-on-surface-variant text-sm font-medium tracking-wide">Enter your credentials to access the IoT Scholar ecosystem</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 sm:p-10 ambient-shadow">
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-[11px] font-bold uppercase tracking-widest text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="alternate_email">alternate_email</span>
</div>
<input class="w-full pl-11 pr-4 py-3.5 bg-surface-container-highest border-none rounded-lg text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/20 transition-all duration-200 outline-none" id="email" name="email" placeholder="name@university.edu" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="block text-[11px] font-bold uppercase tracking-widest text-on-surface-variant" for="password">Password</label>
<a class="text-[11px] font-bold uppercase tracking-widest text-secondary hover:text-secondary-dim transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="w-full pl-11 pr-4 py-3.5 bg-surface-container-highest border-none rounded-lg text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/20 transition-all duration-200 outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Remember Me (Contextual addition for high-end UI) -->
<div class="flex items-center space-x-3 ml-1">
<input class="w-4 h-4 rounded border-none bg-surface-container-highest text-secondary focus:ring-0 focus:ring-offset-0" id="remember" type="checkbox"/>
<label class="text-xs font-medium text-on-surface-variant cursor-pointer" for="remember">Keep me signed in for 30 days</label>
</div>
<!-- CTA Action -->
<button class="w-full button-gradient text-on-primary font-bold py-4 rounded-full shadow-lg shadow-primary/10 hover:opacity-90 active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[18px]" data-icon="login">login</span>
</button>
</form>
<!-- Divider Alternative: Color shift vs 1px line -->
<div class="mt-10 pt-8 border-t border-outline-variant/10 text-center">
<p class="text-on-surface-variant text-xs mb-4">First time here?</p>
<button class="w-full py-3 px-6 rounded-full border border-outline-variant/20 text-on-surface font-semibold text-sm hover:bg-surface-container transition-colors">
                        Request Institutional Access
                    </button>
</div>
